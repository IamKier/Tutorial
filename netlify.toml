# =============================================================================
# netlify.toml — HOW NETLIFY SHOULD BUILD THIS
# =============================================================================
#
# Without this file Netlify has to guess, and it guesses that the repository
# root is the website. The root has no index.html — the page you are looking
# for is generated into dist/ by Vite — so you get a blank page with no error
# to explain it.
#
# The library is entirely static: HTML, CSS, one JavaScript bundle and fifteen
# lesson files. Nothing on the reading side calls a server, which is why it can
# live on a static host at all.
#
# The one exception is the task app at #/demo. It needs the Node backend, which
# Netlify cannot run, so that route detects the missing API and says so rather
# than failing silently. Run the project locally to use it.
# =============================================================================

[build]
  # Vite compiles client/ into dist/. Netlify runs this, then serves what it
  # produced.
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Netlify's default Node is older than this project's. package.json declares
  # node >=24; if these disagree the install fails with an engine error that
  # reads as though your dependencies are broken.
  NODE_VERSION = "24"

# -----------------------------------------------------------------------------
# Routing
#
# The router uses the hash (#/lesson/css-basics), and a hash is never sent to
# the server — so every route is really a request for "/" and no redirect is
# strictly needed.
#
# This rule is here for the case where someone types a path directly, or where
# the app later moves to real paths. Serving index.html with a 200 rather than
# a 301 means the URL in the address bar is preserved for the app to read.
# -----------------------------------------------------------------------------
# There is no backend on a static host. Answer /api/* honestly with a 404
# rather than letting the catch-all below hand back index.html with a 200 —
# a web page pretending to be an API response is the confusing case.
#
# Order matters: Netlify uses the first rule that matches.
[[redirects]]
  from = "/api/*"
  to = "/404-no-api"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# -----------------------------------------------------------------------------
# Headers
#
# The same protections the Node server sends, since Netlify is now the server.
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # Only load code from this origin. No CDNs, and crucially no inline
    # scripts — script-src has no 'unsafe-inline', which is the part of a CSP
    # that actually stops injected script, and why the theme script lives in
    # boot.js rather than in a <script> tag.
    #
    # Three deliberate allowances, each for the runnable examples:
    #
    #   style-src 'unsafe-inline'  the example previews carry their own <style>
    #   worker-src blob:           JavaScript examples run in a blob Worker
    #   frame-src 'self'           HTML examples render in a sandboxed iframe
    #
    # The style allowance is a real, if small, loosening: it lets injected
    # markup restyle the page. It cannot execute anything, which is why this is
    # a very different proposition from allowing inline script.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

    # Never guess a file's type from its contents.
    X-Content-Type-Options = "nosniff"

    # Do not leak our paths to other sites in the Referer header.
    Referrer-Policy = "same-origin"

    # Nobody may put this page in an iframe — stops clickjacking.
    X-Frame-Options = "DENY"

    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Vite fingerprints asset filenames (index-JkBkS_6t.js), so the content at a
# given name can never change. That makes it safe to cache forever: a new build
# produces a new name, and the browser fetches it because the name is new.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html is the opposite case. It is the file that points at everything
# else, so caching it would keep serving the old app after a deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Lesson content changes when a lesson is edited, and the filename does not
# change with it — so revalidate rather than cache blindly.
[[headers]]
  for = "/lessons/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
